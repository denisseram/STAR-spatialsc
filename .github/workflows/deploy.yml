name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # The bucket is private now: image URLs embedded in the built site are
    # S3 presigned URLs, which AWS hard-caps at 7 days. Rebuild every 3
    # days so the live site's URLs never expire between deploys.
    - cron: "0 3 */3 * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node (para el frontend)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install Node dependencies
      - name: Install dependencies (Node)
        run: npm ci

      # The bucket is private, so both downloading content/ and presigning
      # image URLs (done during `npm run build`) need real credentials.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Download processed content from S3
        run: |
          aws s3 sync \
            s3://data01.jku-vds-lab.at/other/STAR-spatial/data/content \
            ./public/data/content \
            --exclude ".DS_Store"

      # Build the frontend AFTER data exists
      - name: Build
        run: npm run build

      # Upload dist folder to GitHub Pages
      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
