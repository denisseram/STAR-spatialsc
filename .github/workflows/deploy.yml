name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node (para el frontend)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install Node dependencies
      - name: Install dependencies (Node)
        run: npm ci

      # Data (JSON de quotations/codes/sources) ya viene procesada y pública
      # en S3 (subida por el equipo desde output.py). No hace falta
      # credenciales de AWS porque el prefijo content/ es de lectura pública.
      - name: Download processed content from S3
        run: |
          aws s3 sync \
            s3://data01.jku-vds-lab.at/other/STAR-spatial/data/content \
            ./public/data/content \
            --no-sign-request \
            --exclude ".DS_Store"

      # Build the frontend AFTER data exists
      - name: Build
        run: npm run build

      # Upload dist folder to GitHub Pages
      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
