name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Setup Node (para el frontend)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Setup Python (para correr output.py)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install Node dependencies
      - name: Install dependencies (Node)
        run: npm ci

      # (Opcional) instalar dependencias Python si las necesitas
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      # Download STAR-spatial-taxo.qdpx from Dropbox
      - name: Download QDPX
        run: |
          wget -O STAR-spatial-taxo.qdpx "https://drive.jku.at/filr/public-link/file-download/0cce88f09cb465a3019d490b3e02008a/80800/-9009391888332555966/STAR-spatial-vfinal.qdpx"

      # Download STAR-spatial.json from Dropbox
      - name: Download bibliography JSON
        run: |
          wget -O STAR-spatial-taxo.json "https://drive.jku.at/filr/public-link/file-download/0cce88f09b463f35019c7648abf212d3/79032/6175549008423465381/STAR-spatial_taxo_v4.json"

      # Run your Python processing script
      - name: Process QDPX → JSON
        run: |
          python output.py \
            --input STAR-spatial-taxo.qdpx \
            --output public/data \
            --bibliography STAR-spatial-taxo.json

      # Build the frontend AFTER data exists
      - name: Build
        run: npm run build

      # Upload dist folder to GitHub Pages
      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

